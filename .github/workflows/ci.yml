name: Verify koans

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .toolchain/downloads
            .toolchain/cargo
          key: koans-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('toolchain.lock.json', 'toolchain/*.lock') }}
      - name: Build from pinned sources
        run: ./setup
      - name: Verify runner, native diagnostics, watch mode, and guide examples
        run: python3 -m unittest discover -s tests -v
      - name: Verify every solution and starter offline
        run: sudo unshare --net -- ./koans --verify
      - name: Check the first learner failure
        shell: bash
        run: |
          status=0
          ./koans --once > first-failure.txt 2>&1 || status=$?
          test "$status" -eq 1
          grep -q '0/72 koans complete' first-failure.txt
          grep -q 'Top level free variables' first-failure.txt
      - name: Check repeated setup offline
        run: sudo unshare --net -- ./setup
      - name: Check that local answers stay out of Git
        run: |
          test -z "$(git ls-files -- exercises)"
          git check-ignore -q exercises/01_values/koans.rho
      - name: Check that setup and verification preserve shared course files
        run: git diff --exit-code -- starters solutions course.json toolchain.lock.json toolchain
